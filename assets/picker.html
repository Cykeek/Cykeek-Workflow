<!doctype html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Cykeek prototype picker</title>
<!--
  Cykeek: prototype picker chrome.
  This file IS the spec. Copy the <nav>, <style> and <script> blocks verbatim into the
  prototype surface and replace only two things: the button list (names and count) and
  the `variants` array. Never restyle the picker with the project's tokens — it must read
  as harness chrome, not as part of the design being judged.
  The .demo rules below exist only so this file opens as a working example; delete them.
-->
<style>
  /* ---- demo only: delete when copying ---- */
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #111; background: #f6f5f2; }
  #stage { min-height: 100vh; display: grid; place-items: center; padding: 48px 24px 120px; }
  .demo-card { max-width: 420px; padding: 28px; border-radius: 16px; background: #fff; border: 1px solid #e4e2dc; }
  .demo-card h1 { margin: 0 0 8px; font-size: 26px; line-height: 1.15; }
  .demo-card p { margin: 0; color: #666; font-size: 15px; line-height: 1.5; }
  .demo-card.editorial h1 { font-size: 40px; letter-spacing: -0.02em; }
  .demo-card.playful { background: #1b1b1f; border-color: #1b1b1f; color: #f4f2ff; }
  .demo-card.playful p { color: #a9a5c0; }
  /* ---- picker: copy from here ---- */
  .proto-picker {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2147483647;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 4px;
    border-radius: 999px;
    background: rgba(10, 10, 10, 0.82);
    -webkit-backdrop-filter: blur(12px) saturate(1.4);
    backdrop-filter: blur(12px) saturate(1.4);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.08) inset,
      0 8px 24px rgba(0, 0, 0, 0.24),
      0 2px 6px rgba(0, 0, 0, 0.12);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    line-height: 1;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
  }

  .proto-picker-highlight {
    position: absolute;
    top: 4px;
    left: 0;
    height: 28px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.12);
  }

  /* The slide is enabled only after first paint (data-ready), so load doesn't animate. */
  .proto-picker[data-ready] .proto-picker-highlight {
    transition:
      transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
      width 250ms cubic-bezier(0.23, 1, 0.32, 1);
  }

  @media (prefers-reduced-motion: reduce) {
    .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
  }

  .proto-picker-item {
    position: relative; /* sits above the highlight */
    display: flex;
    align-items: center;
    height: 28px;
    padding: 0 12px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: rgba(255, 255, 255, 0.55);
    font: inherit;
    cursor: pointer;
    transition:
      color 150ms ease-out,
      transform 160ms cubic-bezier(0.23, 1, 0.32, 1);
  }

  @media (hover: hover) and (pointer: fine) {
    .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
  }

  .proto-picker-item:active { transform: scale(0.97); }

  .proto-picker-item:focus-visible {
    outline: 2px solid rgba(255, 255, 255, 0.4);
    outline-offset: 2px;
  }

  .proto-picker-item[data-active] { color: #fff; }

  .proto-picker-divider {
    width: 1px;
    height: 16px;
    margin: 0 4px;
    background: rgba(255, 255, 255, 0.12);
  }

  .proto-picker-replay { padding: 0 10px; font-size: 14px; }

  .proto-picker[data-position='top'] { bottom: auto; top: 24px; }
</style>
</head>
<body>
<div id='stage'></div>

<nav class='proto-picker' aria-label='Prototype variants'>
  <span class='proto-picker-highlight' aria-hidden='true'></span>
  <button class='proto-picker-item' data-active aria-current='true'>Quiet</button>
  <button class='proto-picker-item'>Editorial</button>
  <button class='proto-picker-item'>Playful</button>
  <span class='proto-picker-divider' aria-hidden='true'></span>
  <button class='proto-picker-item proto-picker-replay' aria-label='Replay animation (R)'>↻</button>
</nav>

<script>
// `variants` is an array of render functions, one per variant, in picker order.
const variants = [
  () => `<div class='demo-card'><h1>Quiet</h1><p>Borders over shadows, little motion. Wins on a daily-use tool; least memorable.</p></div>`,
  () => `<div class='demo-card editorial'><h1>Editorial</h1><p>Large type, generous space. Wins when the moment deserves weight; eats vertical space.</p></div>`,
  () => `<div class='demo-card playful'><h1>Playful</h1><p>Dark surface, saturated accent. Wins for consumer apps; wrong for a dashboard.</p></div>`,
];

const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

const requested = parseInt(new URLSearchParams(location.search).get('v'), 10);
setActive(requested >= 1 && requested <= variants.length ? requested - 1 : 0);
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body>
</html>
